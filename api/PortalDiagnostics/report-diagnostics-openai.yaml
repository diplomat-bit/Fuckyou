openapi: 3.0.3
info:
  title: Portal Diagnostics & System Health Snapshot API
  description: >-
    OpenAPI 3.0 specification for the Enterprise Portal Diagnostics engine.
    Provides complete visibility into system health snapshots, subsystem diagnostics,
    telemetry analytics, dependency graph evaluations, and security posture monitoring
    across all cloud and sovereign ledger bridges.
  version: 1.0.0
  contact:
    name: Platform Operations & Engineering
    email: diagnostics-admin@enterprise.internal
  license:
    name: Proprietary
    url: https://enterprise.internal/licenses/proprietary

servers:
  - url: https://api.portal.internal/v1/diagnostics
    description: Internal Production Diagnostics Gateway
  - url: https://staging-api.portal.internal/v1/diagnostics
    description: Staging Environment Diagnostics Gateway
  - url: http://localhost:8080/v1/diagnostics
    description: Local Development Emulator

security:
  - BearerAuth: []
  - DiagnosticApiKey: []

paths:
  /report:
    get:
      summary: Retrieve Full System Health Snapshot Report
      description: >-
        Fetches a comprehensive diagnostic report containing sub-system health statuses,
        latency metrics, error traces, dependency graphs, security scan results, and
        resource utilization snapshots across all integrated cloud and financial services.
      operationId: getDiagnosticReport
      tags:
        - Diagnostic Reports
      parameters:
        - name: scope
          in: query
          description: Filter diagnostic report scope (e.g., full, infrastructure, core_api, banking_bridges)
          required: false
          schema:
            type: string
            default: full
            enum:
              - full
              - infrastructure
              - core_api
              - banking_bridges
              - sovereign_ledger
              - cloud_federation
        - name: includeDependencyGraph
          in: query
          description: Toggle inclusion of the full system dependency graph
          required: false
          schema:
            type: boolean
            default: true
        - name: includeSecurityScan
          in: query
          description: Toggle inclusion of recent PQC and FAPI security audit results
          required: false
          schema:
            type: boolean
            default: true
        - name: severityThreshold
          in: query
          description: Minimum severity level of issues to include in the error summary
          required: false
          schema:
            type: string
            enum:
              - INFO
              - WARNING
              - ERROR
              - CRITICAL
            default: WARNING
      responses:
        '200':
          description: Successfully generated diagnostic report snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
        '400':
          description: Invalid request parameters or unsupported diagnostic scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access - missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions to execute diagnostic report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during diagnostic aggregation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Trigger On-Demand System Diagnostic Scan
      description: >-
        Initiates a synchronous or asynchronous full diagnostic evaluation across all system nodes,
        subsystem checks, database health monitors, and cloud infrastructure bridges.
      operationId: triggerDiagnosticScan
      tags:
        - Diagnostic Actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticTriggerRequest'
      responses:
        '202':
          description: Diagnostic evaluation initiated asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTriggerResponse'
        '200':
          description: Synchronous diagnostic evaluation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
        '400':
          description: Invalid trigger configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Diagnostic execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /report/latest:
    get:
      summary: Retrieve Most Recent Cached Diagnostic Report
      description: >-
        Returns the last generated diagnostic report without executing a new scan,
        minimizing system overhead while providing near real-time operational status.
      operationId: getLatestDiagnosticReport
      tags:
        - Diagnostic Reports
      responses:
        '200':
          description: Cached diagnostic report payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
        '404':
          description: No cached diagnostic report found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /report/{reportId}:
    get:
      summary: Retrieve Specific Diagnostic Report by ID
      description: Fetches a historic diagnostic report by its unique identifier.
      operationId: getDiagnosticReportById
      tags:
        - Diagnostic Reports
      parameters:
        - name: reportId
          in: path
          required: true
          description: Unique identifier of the target diagnostic report
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historic diagnostic report retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
        '404':
          description: Report ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete Historic Diagnostic Report
      description: Removes a archived diagnostic report from storage.
      operationId: deleteDiagnosticReport
      tags:
        - Diagnostic Maintenance
      parameters:
        - name: reportId
          in: path
          required: true
          description: Unique identifier of the report to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Diagnostic report deleted successfully
        '404':
          description: Report ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Lightweight Ping & System Status
      description: High-frequency health endpoint returning aggregate status and latency indicators.
      operationId: getQuickHealthStatus
      tags:
        - Health Checks
      responses:
        '200':
          description: System is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickHealthStatus'
        '503':
          description: System is degraded or critical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickHealthStatus'

  /telemetry:
    post:
      summary: Ingest System Telemetry Batch
      description: Receives telemetry metrics and health pings from distributed services and edge agents.
      operationId: ingestTelemetry
      tags:
        - Telemetry Ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '202':
          description: Telemetry batch accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ACCEPTED
                  recordsProcessed:
                    type: integer
                    example: 42
                  ingestionTimestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2/OIDC JWT Bearer token containing admin or diagnostic read roles.
    DiagnosticApiKey:
      type: apiKey
      in: header
      name: X-Diagnostic-API-Key
      description: Dedicated high-priority API key for automated monitoring probes.

  schemas:
    DiagnosticReport:
      type: object
      required:
        - id
        - timestamp
        - overallStatus
        - environment
        - executionDurationMs
        - summary
        - subsystems
        - metrics
      properties:
        id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        timestamp:
          type: string
          format: date-time
          example: '2025-03-30T14:32:00.000Z'
        overallStatus:
          $ref: '#/components/schemas/HealthState'
        environment:
          type: string
          example: production
          enum:
            - production
            - staging
            - development
            - sandbox
        executionDurationMs:
          type: integer
          example: 342
        summary:
          type: object
          properties:
            totalSubsystemsChecked:
              type: integer
              example: 18
            healthyCount:
              type: integer
              example: 16
            degradedCount:
              type: integer
              example: 2
            criticalCount:
              type: integer
              example: 0
            activeAlertsCount:
              type: integer
              example: 1
        subsystems:
          type: array
          items:
            $ref: '#/components/schemas/SubsystemStatus'
        metrics:
          $ref: '#/components/schemas/SystemMetrics'
        securityScan:
          $ref: '#/components/schemas/SecurityScanSummary'
        dependencyGraph:
          type: array
          items:
            $ref: '#/components/schemas/DependencyNode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticError'
        metadata:
          type: object
          additionalProperties:
            type: string
          example:
            clusterId: us-east-prod-01
            orchestratorVersion: 2.4.1

    HealthState:
      type: string
      enum:
        - HEALTHY
        - DEGRADED
        - CRITICAL
        - UNKNOWN
        - MAINTENANCE
      example: HEALTHY

    SubsystemStatus:
      type: object
      required:
        - name
        - category
        - status
        - responseTimeMs
        - lastChecked
      properties:
        name:
          type: string
          example: CitiSovereignLedgerBridge
        category:
          type: string
          example: banking_integration
          enum:
            - core_api
            - database
            - banking_integration
            - cloud_provider
            - identity_provider
            - messaging_bus
            - security_vault
        status:
          $ref: '#/components/schemas/HealthState'
        responseTimeMs:
          type: number
          format: float
          example: 45.2
        lastChecked:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties:
            type: string
          example:
            endpoint: https://api.citiconnect.internal/v1/health
            fapiConformance: compliant
            mTLSHandshake: success
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SubsystemCheck'

    SubsystemCheck:
      type: object
      required:
        - checkName
        - status
        - durationMs
      properties:
        checkName:
          type: string
          example: DatabaseConnectionPoolCheck
        status:
          $ref: '#/components/schemas/HealthState'
        durationMs:
          type: integer
          example: 12
        message:
          type: string
          example: Active connections 42/100 within acceptable threshold.
        errorDetails:
          type: string

    SystemMetrics:
      type: object
      required:
        - cpuUsagePercent
        - memoryUsageBytes
        - activeConnections
        - requestThroughputRps
        - errorRatePercent
        - diskUtilizationPercent
      properties:
        cpuUsagePercent:
          type: number
          format: float
          example: 34.8
        memoryUsageBytes:
          type: integer
          format: int64
          example: 8589934592
        memoryTotalBytes:
          type: integer
          format: int64
          example: 17179869184
        activeConnections:
          type: integer
          example: 1250
        requestThroughputRps:
          type: number
          format: float
          example: 450.5
        errorRatePercent:
          type: number
          format: float
          example: 0.02
        diskUtilizationPercent:
          type: number
          format: float
          example: 61.2
        networkIngressBps:
          type: integer
          format: int64
          example: 10485760
        networkEgressBps:
          type: integer
          format: int64
          example: 52428800

    SecurityScanSummary:
      type: object
      required:
        - vulnerabilitiesFound
        - pqcComplianceStatus
        - jweJwsIntegrity
        - fapiConformance
      properties:
        vulnerabilitiesFound:
          type: integer
          example: 0
        criticalCount:
          type: integer
          example: 0
        highCount:
          type: integer
          example: 0
        mediumCount:
          type: integer
          example: 0
        lowCount:
          type: integer
          example: 2
        pqcComplianceStatus:
          type: string
          example: COMPLIANT_KYBER1024
          enum:
            - COMPLIANT_KYBER1024
            - COMPLIANT_DILITHIUM5
            - HYBRID_MODE
            - NON_COMPLIANT
        jweJwsIntegrity:
          type: string
          example: VERIFIED
          enum:
            - VERIFIED
            - INVALID_SIGNATURE
            - EXPIRED_KEY
        fapiConformance:
          type: string
          example: FAPI_ADVANCED_PROFILE_PASSED

    DependencyNode:
      type: object
      required:
        - id
        - name
        - type
        - status
      properties:
        id:
          type: string
          example: node-citiconnect-01
        name:
          type: string
          example: CitiConnect Gateway Service
        type:
          type: string
          example: external_api
          enum:
            - database
            - service
            - external_api
            - message_queue
            - cache
        status:
          $ref: '#/components/schemas/HealthState'
        latencyMs:
          type: number
          format: float
          example: 28.4
        dependencies:
          type: array
          items:
            type: string
          example: ["node-auth-01", "node-secret-vault"]

    DiagnosticError:
      type: object
      required:
        - errorId
        - code
        - subsystem
        - severity
        - message
        - occurrenceTime
      properties:
        errorId:
          type: string
          format: uuid
          example: 7f8a1e2d-3c4b-5a6b-7c8d-9e0f1a2b3c4d
        code:
          type: string
          example: ERR_DB_CONN_TIMEOUT
        subsystem:
          type: string
          example: BigQueryEmulatorBridge
        severity:
          type: string
          enum:
            - INFO
            - WARNING
            - ERROR
            - CRITICAL
          example: WARNING
        message:
          type: string
          example: Connection timeout exceeded threshold on secondary pool (attempt 2/3)
        stackTrace:
          type: string
          example: 'Error: Connection timeout\n  at DatabaseBridge.connect (DatabaseBridge.ts:84)'
        occurrenceTime:
          type: string
          format: date-time

    DiagnosticTriggerRequest:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          default: full
          enum:
            - full
            - infrastructure
            - core_api
            - banking_bridges
            - sovereign_ledger
            - cloud_federation
        runAsync:
          type: boolean
          default: false
        notifyOnFailure:
          type: boolean
          default: true
        notificationWebhookUrl:
          type: string
          format: uri
          example: https://api.portal.internal/v1/diagnostics/alerts/webhook
        tags:
          type: array
          items:
            type: string
          example: ["manual-trigger", "post-deployment"]

    DiagnosticTriggerResponse:
      type: object
      required:
        - reportId
        - status
        - traceId
      properties:
        reportId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        status:
          type: string
          example: IN_PROGRESS
          enum:
            - QUEUED
            - IN_PROGRESS
            - COMPLETED
            - FAILED
        estimatedTimeMs:
          type: integer
          example: 1500
        traceId:
          type: string
          example: trace-88902174901824

    TelemetryBatch:
      type: object
      required:
        - sourceId
        - timestamp
        - metrics
      properties:
        sourceId:
          type: string
          example: node-worker-us-east-42
        timestamp:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            type: object
            required:
              - name
              - value
              - timestamp
            properties:
              name:
                type: string
                example: http_request_duration_ms
              value:
                type: number
                format: float
                example: 12.4
              unit:
                type: string
                example: ms
              timestamp:
                type: string
                format: date-time
              tags:
                type: object
                additionalProperties:
                  type: string

    QuickHealthStatus:
      type: object
      required:
        - status
        - timestamp
        - uptimeSeconds
      properties:
        status:
          $ref: '#/components/schemas/HealthState'
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          example: 1209600
        version:
          type: string
          example: 1.4.2

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: INVALID_DIAGNOSTIC_SCOPE
        message:
          type: string
          example: The requested scope 'unsupported_scope' does not exist.
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
          example: ["Valid options are: full, infrastructure, core_api, banking_bridges, sovereign_ledger, cloud_federation"]