# Workflow for building, configuring Git/GitHub CLI, automating PR creation, and deploying static content
name: Automated PR and Deploy Workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      # --- Git and GitHub CLI Setup and PR Creation ---
      - name: Configure Git Identity and Remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure remote origin is explicitly set using the repository context
          if ! git remote get-url origin > /dev/null 2>&1; then
            git remote add origin https://github.com/${{ github.repository }}.git
          fi

      - name: Authenticate GitHub CLI & Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify authentication
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

          # Create a dedicated branch, commit any build adjustments if needed, and open a PR
          BRANCH_NAME="automated-deployment-update-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"
          
          # Stage any potential modifications (like built assets or config tweaks if tracking them)
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated update from workflow run ${{ github.run_number }}"
          
          # Push the branch and create the pull request
          git push -u origin "$BRANCH_NAME" --force
          
          gh pr create \
            --title "Automated Deployment Update #${{ github.run_number }}" \
            --body "This pull request was automatically generated by GitHub Actions during workflow run ${{ github.run_number }}." \
            --head "$BRANCH_NAME" \
            --base "main" || echo "Pull request already exists or could not be created."

      # --- GitHub Pages Deployment Steps ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        
