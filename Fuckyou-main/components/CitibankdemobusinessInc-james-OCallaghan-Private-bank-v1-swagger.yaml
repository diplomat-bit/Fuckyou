                </div>
                <div className="p-4 font-mono text-xs text-slate-300 overflow-x-auto bg-slate-950 min-h-[200px]">
                  {apiResponse ? (
                    <pre>{JSON.stringify(apiResponse, null, 2)}</pre>
                  ) : (
                    <div className="flex flex-col items-center justify-center h-48 text-slate-500">
                      <InfoIcon />
                      <p className="mt-2">Send a request to view the live API response payload.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* TAB 3: CITIBANK / MODERN TREASURY API */}
        {activeTab === 'treasury-api' && (
          <div className="space-y-6">
            <div className="bg-slate-950 p-6 rounded-xl border border-slate-800">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                  <h2 className="text-lg font-bold text-white">Citibank Private Bank API Endpoints</h2>
                  <p className="text-sm text-slate-400">Powered by Modern Treasury REST API integration</p>
                </div>
                <div className="relative w-full md:w-72">
                  <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <SearchIcon />
                  </span>
                  <input
                    type="text"
                    placeholder="Search endpoints..."
                    value={treasurySearch}
                    onChange={(e) => setTreasurySearch(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase">
                      <th className="py-3 px-4">Method</th>
                      <th className="py-3 px-4">Path</th>
                      <th className="py-3 px-4">Description</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-sm">
                    {treasuryEndpoints.map((endpoint, idx) => (
                      <tr key={idx} className="hover:bg-slate-900/50 transition-colors">
                        <td className="py-3 px-4">
                          <span className={`px-2 py-1 rounded text-xs font-bold font-mono ${
                            endpoint.method === 'GET' ? 'bg-emerald-950 text-emerald-400' : 'bg-blue-950 text-blue-400'
                          }`}>
                            {endpoint.method}
                          </span>
                        </td>
                        <td className="py-3 px-4 font-mono text-xs text-slate-200">{endpoint.path}</td>
                        <td className="py-3 px-4 text-slate-400">{endpoint.desc}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {/* TAB 4: INTEGRATION FLOW SIMULATOR */}
        {activeTab === 'simulator' && (
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Left Column: Step Controller */}
            <div className="lg:col-span-5 space-y-6">
              <div className="bg-slate-950 p-6 rounded-xl border border-slate-800">
                <h2 className="text-lg font-bold text-white mb-4">Step-by-Step Flow Simulator</h2>
                <p className="text-sm text-slate-400 mb-6">
                  Simulate a real-world integration scenario where a Citibank Private Bank client enrolls their account into Chase Pay with Points.
                </p>

                <div className="space-y-4">
                  <div className={`p-4 rounded-lg border transition-all ${
                    simulatorStep >= 1 ? 'bg-blue-950/30 border-blue-800' : 'bg-slate-900/50 border-slate-800'
                  }`}>
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                        simulatorStep >= 1 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>1</span>
                      <div>
                        <h4 className="font-semibold text-sm text-white">Health Check</h4>
                        <p className="text-xs text-slate-400">Verify Chase API Gateway availability.</p>
                      </div>
                    </div>
                    {simulatorStep === 0 && (
                      <button
                        onClick={() => runSimulatorStep(1)}
                        className="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded transition-all"
                      >
                        Execute Health Check
                      </button>
                    )}
                  </div>

                  <div className={`p-4 rounded-lg border transition-all ${
                    simulatorStep >= 3 ? 'bg-blue-950/30 border-blue-800' : 'bg-slate-900/50 border-slate-800'
                  }`}>
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                        simulatorStep >= 3 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>2</span>
                      <div>
                        <h4 className="font-semibold text-sm text-white">Citibank Account Verification</h4>
                        <p className="text-xs text-slate-400">Fetch account details via Modern Treasury.</p>
                      </div>
                    </div>
                    {simulatorStep === 1 && (
                      <button
                        onClick={() => {
                          runSimulatorStep(2);
                          setTimeout(() => runSimulatorStep(3), 1000);
                        }}
                        className="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded transition-all"
                      >
                        Verify Citibank Account
                      </button>
                    )}
                  </div>

                  <div className={`p-4 rounded-lg border transition-all ${
                    simulatorStep >= 5 ? 'bg-blue-950/30 border-blue-800' : 'bg-slate-900/50 border-slate-800'
                  }`}>
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                        simulatorStep >= 5 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>3</span>
                      <div>
                        <h4 className="font-semibold text-sm text-white">Chase Enrollment</h4>
                        <p className="text-xs text-slate-400">Submit enrollment request to Chase API.</p>
                      </div>
                    </div>
                    {simulatorStep === 3 && (
                      <button
                        onClick={() => {
                          runSimulatorStep(4);
                          setTimeout(() => runSimulatorStep(5), 1000);
                        }}
                        className="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded transition-all"
                      >
                        Submit Enrollment
                      </button>
                    )}
                  </div>

                  <div className={`p-4 rounded-lg border transition-all ${
                    simulatorStep >= 6 ? 'bg-blue-950/30 border-blue-800' : 'bg-slate-900/50 border-slate-800'
                  }`}>
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                        simulatorStep >= 6 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>4</span>
                      <div>
                        <h4 className="font-semibold text-sm text-white">Ledger Sync</h4>
                        <p className="text-xs text-slate-400">Post ledger transaction in Modern Treasury.</p>
                      </div>
                    </div>
                    {simulatorStep === 5 && (
                      <button
                        onClick={() => runSimulatorStep(6)}
                        className="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded transition-all"
                      >
                        Sync Ledger &amp; Complete
                      </button>
                    )}
                  </div>
                </div>

                {simulatorStep > 0 && (
                  <button
                    onClick={resetSimulator}
                    className="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-bold py-2 px-4 rounded border border-slate-800 transition-all flex items-center justify-center gap-2"
                  >
                    <RefreshIcon /> Reset Simulator
                  </button>
                )}
              </div>
            </div>

            {/* Right Column: Live Logs */}
            <div className="lg:col-span-7 space-y-6">
              <div className="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden h-full flex flex-col">
                <div className="bg-slate-900 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                  <span className="text-xs font-mono text-slate-300">Live Integration Logs</span>
                  <span className="text-xs bg-blue-950 text-blue-400 px-2 py-0.5 rounded font-mono">
                    Active Session
                  </span>
                </div>
                <div className="p-4 font-mono text-xs text-slate-300 overflow-y-auto flex-1 min-h-[350px] bg-slate-950 space-y-2">
                  {simulatorLogs.length > 0 ? (
                    simulatorLogs.map((log, idx) => (
                      <div key={idx} className="border-l-2 border-blue-500 pl-3 py-1 bg-slate-900/30 rounded-r">
                        {log}
                      </div>
                    ))
                  ) : (
                    <div className="flex flex-col items-center justify-center h-full text-slate-500">
                      <InfoIcon />
                      <p className="mt-2">Start the simulator to view live integration logs.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}

      </main>

      {/* Footer */}
      <footer className="border-t border-slate-800 bg-slate-950 py-8 px-6 mt-12">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-slate-500">
          <div className="flex items-center gap-2">
            <span className="font-bold text-slate-400">Citibank Private Bank</span>
            <span>|</span>
            <span>Chase Loyalty Solutions</span>
          </div>
          <p>© {new Date().getFullYear()} Restricted Chase &amp; Citibank Private Bank. All rights reserved.</p>
        </div>
      </footer>
    </div>
  );
}