openapi: 3.0.0
info:
  title: Portal Diagnostics API
  description: API for system health monitoring, memory dumps, and diagnostic execution within the Aquarius ecosystem.
  version: 1.1.0
servers:
  - url: /api/diagnostics
    description: Local diagnostic gateway
paths:
  /health:
    get:
      summary: Get system health status
      operationId: getSystemHealth
      responses:
        '200':
          description: System is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /memory-dump:
    post:
      summary: Trigger a memory dump for debugging
      operationId: triggerMemoryDump
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Memory dump initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
  /logs/analyze:
    post:
      summary: Analyze system logs for anomalies
      operationId: analyzeLogs
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeRange:
                  type: string
      responses:
        '200':
          description: Analysis complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReport'
  /security/scan:
    post:
      summary: Run a security vulnerability scan
      operationId: runSecurityScan
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Scan results generated
  /telemetry/collect:
    post:
      summary: Ingest system telemetry data
      operationId: collectTelemetry
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metric:
                  type: string
                value:
                  type: number
      responses:
        '201':
          description: Telemetry recorded
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SystemStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, critical]
        uptime:
          type: integer
        memoryUsage:
          type: number
    DiagnosticReport:
      type: object
      properties:
        reportId:
          type: string
        timestamp:
          type: string
          format: date-time
        summary:
          type: string
        details:
          type: object