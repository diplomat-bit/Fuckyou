import React from 'react';

interface ChaseAccountSummaryProps {
  accountSummary: Array<{
    accountGroup: string;
    checking?: Array<any>;
    savings?: Array<any>;
    deposits?: Array<any>;
    securitydeposits?: Array<any>;
    timedeposits?: Array<any>;
    investments?: Array<any>;
    trust?: Array<any>;
    custody?: Array<any>;
    creditcards?: Array<any>;
    loans?: Array<any>;
    escrow?: Array<any>;
  }>;
}

export const ChaseAccountSummary: React.FC<ChaseAccountSummaryProps> = ({ accountSummary }) => {
  return (
    <div className="chase-account-summary">
      <h1>Chase Account Summary</h1>
      {accountSummary.map((group, index) => (
        <div key={index} className="account-group">
          <h2>{group.accountGroup}</h2>
          {/* Render account details based on group type */}
        </div>
      ))}
    </div>
  );
};

interface ChaseTransactionDetailsProps {
  accountId: string;
  accountName: string;
  accountType: string;
  displayAccountNumber: string;
  transactionlist: Array<{
    transactionDateTime: string;
    transactionId: string;
    transactionReferenceNumber: string;
    transactionStatus: string;
    transactionType: string;
    transactionDescription: string;
    alternateCurrencyTransactionAmount: number;
    baseCurrencyTransactionAmount: number;
    transactionQuantity: number;
    alternateCurrencyCode: string;
    baseCurrencyCode: string;
    cusipNumber?: string;
    tickerSymbol?: string;
    assetClass?: string;
  }>;
}

export const ChaseTransactionDetails: React.FC<ChaseTransactionDetailsProps> = ({
  accountName,
  displayAccountNumber,
  transactionlist
}) => {
  return (
    <div className="chase-transaction-details">
      <h1>Transactions for {accountName}</h1>
      <p>Account: {displayAccountNumber}</p>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {transactionlist.map((tx) => (
            <tr key={tx.transactionId}>
              <td>{tx.transactionDateTime}</td>
              <td>{tx.transactionDescription}</td>
              <td>{tx.baseCurrencyTransactionAmount} {tx.baseCurrencyCode}</td>
              <td>{tx.transactionStatus}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};